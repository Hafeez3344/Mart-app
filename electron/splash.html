<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mart POS - Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      text-align: center;
      padding: 30px;
    }
    .logo {
      font-size: 54px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #10b981;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status-text {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
      min-height: 20px;
    }
    .lan-badge {
      margin-top: 18px;
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛒</div>
    <div class="title">SUPER MART POS</div>
    <div class="subtitle">Retail Point of Sale & Inventory Host Engine</div>
    <div class="spinner"></div>
    <div id="status-text">Initializing services...</div>
    <div class="lan-badge" id="lan-text">Detecting local network...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (event, message) => {
      document.getElementById('status-text').innerText = message;
    });
    ipcRenderer.on('splash-lan', (event, ip) => {
      document.getElementById('lan-text').innerText = 'LAN Access: http://' + ip + ':3000';
    });
  </script>
</body>
</html>
